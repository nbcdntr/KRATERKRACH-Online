plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kraterkrach.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kraterkrach.game'
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
